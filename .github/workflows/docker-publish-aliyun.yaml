name: Docker Image Publish to Aliyun ACR

permissions:
  contents: read

on:
  workflow_dispatch:  # 手动触发
  push:               # 自动触发：当版本文件变化时
    paths:
      - 'core/ver.py'

env:
  # 阿里云ACR相关配置(从GitHub Secrets获取)
  REGISTRY: ${{ secrets.ALIYUN_ACR_URL }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from core/ver.py
        id: version
        run: |
          VERSION=$(python3 -c "import sys; sys.path.insert(0, '.'); from core.ver import VERSION; print(VERSION)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_ACR_URL }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ALIYUN_ACR_URL }}/yggacr/ygg-we-mp-rss
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{github.repository}}
            org.opencontainers.image.description=WeChat Mini Program RSS Reader
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push Docker image (amd64 only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.meta.outputs.digest }}"
